<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Invoice Extractor</title>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;margin:0;padding:30px;background:#f8fafc;color:#111}
  .wrap{max-width:900px;margin:0 auto}
  .card{background:#fff;padding:24px;margin-bottom:16px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .hidden{display:none}
  .drop{border:2px dashed #cbd5e1;padding:45px;text-align:center;cursor:pointer;border-radius:8px;transition:.15s}
  .drop:hover{border-color:#2563eb;background:#f0f7ff}
  .input-group{margin:14px 0}
  .input-group label{display:block;font-weight:500;margin-bottom:6px;font-size:14px}
  .input-group input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;font-size:14px;box-sizing:border-box}
  .btn{padding:10px 18px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:500;font-size:14px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.sec{background:#64748b}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:16px}
  th,td{padding:10px;border:1px solid #e5e7eb;text-align:left}
  th{background:#f8fafc;font-weight:600}
  .status{color:#64748b;font-size:13px;margin:6px 0}
  .progress{height:6px;background:#e2e8f0;border-radius:3px;margin:12px 0;overflow:hidden}
  .bar{height:100%;background:#2563eb;width:0%;transition:width .3s}
  .warn{background:#fef3c7;border:1px solid #fde68a;color:#92400e;padding:10px;border-radius:6px;font-size:13px;margin:10px 0}
</style>
</head>
<body>
<div class="wrap">
  <h2 style="margin:0 0 20px">AI Invoice Extractor</h2>
  <div class="card" id="s1">
    <h3>1. Upload Invoices</h3>
    <div class="drop" id="dz">Drag & drop or click (max 40 PDFs)</div>
    <input type="file" id="fi" multiple accept=".pdf" hidden>
    <div class="status" id="fc">0 files selected</div>
  </div>
  <div class="card" id="s2">
    <h3>2. Define Columns</h3>
    <div class="input-group">
      <label>Columns (comma separated)</label>
      <input type="text" id="cols" placeholder="e.g., Company, Date, Total">
    </div>
    <button class="btn" id="btn" disabled>Extract</button>
  </div>
  <div class="card hidden" id="s3">
    <h3>3. Preview & Download</h3>
    <div class="status" id="stat"></div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div style="overflow-x:auto" id="prev"></div>
    <div class="warn">⚠️ Download now. Data vanishes on tab close.</div>
    <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" id="dlxls" disabled>Download Excel</button>
      <button class="btn" id="dlpdf" disabled>Download PDF</button>
      <button class="btn sec" onclick="location.reload()">Reset</button>
    </div>
  </div>
</div>
<script>
const API = "https://invoice-extractor-backend.onrender.com/api"; // REPLACE WITH RENDER URL WHEN DEPLOYED
let files=[], tid=null;
const $=id=>document.getElementById(id);
const dz=$("dz"),fi=$("fi"),fc=$("fc"),cols=$("cols"),btn=$("btn"),prev=$("prev"),stat=$("stat"),dlxls=$("dlxls"),dlpdf=$("dlpdf"),bar=$("bar");

dz.onclick=()=>fi.click();
dz.ondragover=e=>{e.preventDefault();dz.style.borderColor="#2563eb";dz.style.background="#f0f7ff";};
dz.ondragleave=()=>{dz.style.borderColor="#cbd5e1";dz.style.background="#fff";};
dz.ondrop=e=>{e.preventDefault();dz.style.borderColor="#cbd5e1";dz.style.background="#fff";add(e.dataTransfer.files);};
fi.onchange=()=>add(fi.files);
function add(f){const p=Array.from(f).filter(x=>x.type==="application/pdf").slice(0,40);files=[...files,...p];fc.textContent=files.length+" ready";updBtn();}
cols.oninput=updBtn;
function updBtn(){btn.disabled=!(files.length&&cols.value.trim());}

btn.onclick=async()=>{
  btn.disabled=true;btn.textContent="Processing...";
  $("s3").classList.remove("hidden");stat.textContent="Extracting...";prev.innerHTML="";dlxls.disabled=true;dlpdf.disabled=true;bar.style.width="10%";
  let prog=10;const int=setInterval(()=>{prog=Math.min(prog+2,90);bar.style.width=prog+"%";},800);
  const fd=new FormData();files.forEach(f=>fd.append("files",f));
  try{
    const r=await fetch(`${API}/extract?columns=${encodeURIComponent(cols.value.trim())}`,{method:"POST",body:fd});
    if(!r.ok)throw new Error("Backend failed");
    const d=await r.json();tid=d.task_id;
    clearInterval(int);bar.style.width="100%";
    let h="<table><thead><tr>";const k=Object.keys(d.preview[0]||{});k.forEach(x=>h+=`<th>${x}</th>`);h+="</tr></thead><tbody>";
    d.preview.forEach(r=>{h+="<tr>";k.forEach(x=>h+=`<td>${r[x]||"-"}</td>`);h+="</tr>";});h+="</tbody></table>";
    prev.innerHTML=h;stat.textContent=`✅ ${d.total} invoices ready.`;dlxls.disabled=false;dlpdf.disabled=false;
  }catch(e){clearInterval(int);bar.style.width="0%";stat.textContent=`❌ ${e.message}`;}
  btn.textContent="Extract";btn.disabled=false;
};

// ✅ Direct browser navigation bypasses fetch/CORS issues entirely
dlxls.onclick=()=>tid&&window.open(`${API}/download/excel/${tid}`,"_blank");
dlpdf.onclick=()=>tid&&window.open(`${API}/download/pdf/${tid}`,"_blank");
</script>
</body>
</html>
